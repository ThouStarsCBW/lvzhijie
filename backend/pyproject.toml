[project]
name = "lvzhijie-backend"
version = "0.1.0"
description = "Personal legal workspace backend with OpenClaw as WeChat transport only."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "websockets>=15.0.0",
    "cryptography>=45.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
